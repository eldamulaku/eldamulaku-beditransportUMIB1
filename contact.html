<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EldaMulaku-BediTransport</title>
    <link rel="stylesheet" href="./contact.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body id="EM">
    <!-- this is the headee, we use it to navigate through the website -->
    <header class="emHeader">
      <nav class="emMainNav">
        <div class="emLogo">
          <a href="./index.html">
            <img src="./images/logo.PNG" alt="logo" />
          </a>
        </div>

        <!-- burger menu -->
        <input type="checkbox" id="menu-toggle" />
        <label for="menu-toggle" class="burger">&#9776;</label>

        <ul class="emNavLinks">
          <li><a href="./index.html">Home</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./services.html">Services</a></li>
          <li><a href="./gallery.html">Gallery</a></li>
          <li><a href="./blog.html">News</a></li>
          <li><a href="./team.html">Team</a></li>
          <li><a href="./testimonials.html">Testimonials</a></li>
          <li><a href="./faq.html">FAQ</a></li>
          <li><a href="./contact.html">Contact</a></li>
          <li><a href="./terms.html">Terms & Policies</a></li>
        </ul>
      </nav>
    </header>
    <!-- Contact Form -->
    <form action="" class="emContact">
      <h2>Contact Us</h2>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      <div id="liveAlertPlaceholder">
        <button type="submit" class="btn btn-primary" id="liveAlertBtn">
          Send Message
        </button>
      </div>
    </form>
    <script src="./javaScript/contact.js"></script>
  </body>
</html>
